<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="favicon.png?v=20260903123843">
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=20260903123843">
    <link rel="apple-touch-icon" href="favicon.png?v=20260903123843">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111018;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      #unity-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(rgba(5, 4, 10, 0.42), rgba(5, 4, 10, 0.68)),
          url("background-game.png") center center / cover no-repeat,
          #090910;
      }

      #unity-canvas {
        background: #000;
        outline: none;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(560px, 76vw);
        transform: translate(-50%, -50%);
        text-align: center;
        padding: 26px 30px 30px;
        border: 3px solid rgba(255, 185, 77, 0.65);
        border-radius: 10px;
        background: rgba(15, 10, 16, 0.58);
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(2px);
      }

      #unity-title {
        margin-bottom: 18px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #ffd36a;
        text-shadow: 0 3px 0 #4b220f;
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 24px;
        padding: 4px;
        border: 3px solid #2b1408;
        background: #251a14;
        box-shadow: 0 0 0 3px #74421f, 0 6px 0 rgba(0, 0, 0, 0.35);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff8a24, #ffd36a);
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        z-index: 10;
        max-width: min(960px, 90vw);
        font-size: 14px;
      }

      #unity-warning div {
        margin-bottom: 8px;
        padding: 10px 14px;
        border-radius: 4px;
      }

      #unity-footer {
        position: absolute;
        right: 18px;
        bottom: 14px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: rgba(255, 255, 255, 0.78);
        font-size: 13px;
      }

      #unity-fullscreen-button {
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 6px 9px;
        border-radius: 4px;
        user-select: none;
      }

      #unity-fullscreen-button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <span>{{{ PRODUCT_NAME }}}</span>
        <span id="unity-fullscreen-button">Fullscreen</span>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.background = type === "error" ? "#d42323" : "#ffd54d";
        div.style.color = type === "error" ? "#fff" : "#201000";
        warningBanner.appendChild(div);

        if (type !== "error") {
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      // Auto cache-busting: each page load fetches the latest build files.
      var buildVersion = "{{{ PRODUCT_VERSION }}}_" + Date.now();
      var cacheSuffix = "?v=" + encodeURIComponent(buildVersion);
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}" + cacheSuffix;

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}" + cacheSuffix,
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}" + cacheSuffix,
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}" + cacheSuffix,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").style.alignItems = "stretch";
        document.querySelector("#unity-container").style.justifyContent = "stretch";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      } else {
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function(unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = function() {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function(message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
